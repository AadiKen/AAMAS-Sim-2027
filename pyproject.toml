[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bcod-sim"
version = "0.0.0"
description = "BCOD-Sim ground-up rewrite (phase 0 scaffold)"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "numpy>=2,<3", "onnx>=1.17,<2", "onnxruntime>=1.20,<2", "pyarrow>=18,<24", "pydantic>=2,<3", "PyYAML>=6,<7", "scipy>=1.14,<2", "torch>=2.4", "trimesh>=5,<6", "uvicorn>=0.34,<1"]

[project.scripts]
bcod = "bcod_sim.cli:main"
manta-runner = "bcod_sim.web.runner_cli:main"

[project.optional-dependencies]
sysid = ["scipy>=1.14,<2"]
bem = ["capytaine>=2.2,<4", "fast-simplification>=0.2,<1"]
test = ["httpx>=0.28,<1", "numpy>=2,<3", "pytest>=8,<10", "hypothesis>=6,<7",
        "gymnasium>=1,<2", "pettingzoo>=1.24,<2"]
validation = ["matplotlib>=3.9,<4", "gymnasium>=1,<2", "pettingzoo>=1.24,<2",
              "psutil>=6,<9"]
marl = ["benchmarl==1.5.2", "torchrl==0.11.1", "tensordict==0.11.0",
        "torch==2.14.0",
        "pettingzoo==1.24.3", "gymnasium==1.3.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
