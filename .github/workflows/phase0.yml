name: BCOD-Sim phase gates

on:
  push:
  pull_request:

jobs:
  legacy-isolation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/check_legacy_imports.py
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest -q
